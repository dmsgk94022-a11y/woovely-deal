<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen flex justify-center">

  <div class="w-full max-w-md bg-white min-h-screen flex flex-col justify-between shadow-lg">

    <div class="px-5 py-8">

      <!-- 프로필 -->
      <div class="flex flex-col items-center text-center mb-6">

        <div class="w-20 h-20 bg-rose-100 rounded-full flex items-center justify-center mb-3 shadow-inner">
          <i class="fa-solid fa-heart text-3xl text-rose-500"></i>
        </div>

        <h1 class="text-xl font-bold text-gray-900 mb-1">
          우블리맘의 추천 핫딜
        </h1>

        <p class="text-xs text-gray-500 font-medium mb-3">
          엄선된 핫딜과 추천 아이템을 확인해보세요! 🧡
        </p>

        <a
          href="mailto:dmsgk9422@naver.com"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-full text-xs text-gray-700 border border-gray-200 transition-colors"
        >
          <i class="fa-regular fa-envelope text-rose-500"></i>
          <span>비즈니스 문의: dmsgk9422@naver.com</span>
        </a>

      </div>

      <!-- 스마트스토어 -->
      <div class="mb-6">
        <a
          href="https://smartstore.naver.com/woovely2124"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center justify-between p-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl shadow-md transition-all group"
        >
          <div class="flex items-center gap-3">

            <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center text-xl">
              🛍️
            </div>

            <div class="text-left">
              <span class="text-xs font-medium text-emerald-100 block">
                공식 스마트스토어
              </span>
              <span class="text-sm font-bold block">
                우블리스토어 바로가기
              </span>
            </div>

          </div>

          <i class="fa-solid fa-chevron-right text-emerald-200 group-hover:translate-x-1 transition-transform"></i>
        </a>
      </div>

      <div class="border-b border-gray-100 my-4"></div>

      <!-- 검색 및 카테고리 -->
      <div class="mb-4 space-y-3">

        <div class="relative">
          <input
            type="text"
            id="searchInput"
            placeholder="상품명 검색..."
            aria-label="상품명 검색"
            class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-rose-400"
          >
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
        </div>

        <div
          id="categoryButtons"
          class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar"
        ></div>

      </div>

      <!-- 상품 목록 -->
      <div id="productGrid" class="space-y-3"></div>

      <!-- 검색 결과 없음 -->
      <div id="noResults" class="hidden text-center py-10">
        <i class="fa-solid fa-box-open text-3xl text-gray-300 mb-2"></i>
        <p class="text-xs text-gray-400">
          검색 결과가 없습니다.
        </p>
      </div>

    </div>

    <!-- 안내 -->
    <footer class="p-5 text-center bg-gray-50 border-t border-gray-100">

      <p class="text-[10px] text-gray-400 leading-relaxed mb-2">
        * 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
      </p>

      <p class="text-[11px] font-medium text-gray-500">
        © 우블리맘. All rights reserved.
      </p>

    </footer>

  </div>

  <script>
    // 카테고리 목록: 건강식품 유지
    const categories = [
      "전체",
      "식품",
      "화장품",
      "육아용품",
      "생활용품",
      "가전제품"
    ];

    // 상품명, 카테고리, 이미지, 링크는 이 목록에서 수정하세요.
    const products = [
      {
        id: 9,
        title: "코스노리 화이트닝 드레스 톤업크림",
        category: "화장품",
        image: "./images/toneup-cream.jpg",
        link: "https://link.coupang.com/a/hM4q1joPKK",
        badge: "화장품",
        illustration: true
      },
      {
        id: 10,
        title: "위자드조선 누룩밤 수면팩 정품 대용량 기미크림 누룩밤",
        category: "화장품",
        image: "./images/sleeping-cream.jpg",
        link: "https://link.coupang.com/a/hM4yiyq6Ds",
        badge: "화장품",
        illustration: true
      },
      {
        id: 11,
        title: "아이오페 뉴 레티놀 엑스퍼트 0.1% 링클 코렉터 아이크림 기획세트",
        category: "화장품",
        image: "./images/skincare-set.jpg",
        link: "https://link.coupang.com/a/hM4HBzIwQC",
        badge: "화장품",
        illustration: true
      },
      {
        id: 12,
        title: "라비킷 마이리무버100 얼룩제거제",
        category: "생활용품",
        image: "./images/stain-remover.jpg",
        link: "https://link.coupang.com/a/hM5amkXnc4",
        badge: "생활용품",
        illustration: true
      },
      {
        id: 1,
        title: "풀무원 토이쿠키 만들기 신비한 바닷속 이야기 (냉동)",
        category: "식품",
        image: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=300&q=80",
        link: "https://link.coupang.com/a/gcGL1vkoP6",
        badge: "인기키트"
      },
      {
        id: 2,
        title: "뽀로로 DIY 콤비네이션 피자 (냉동)",
        category: "식품",
        image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=300&q=80",
        link: "https://link.coupang.com/a/gcGOTAfOJo",
        badge: "아이간식"
      },
      {
        id: 3,
        title: "풀무원 소불고기 꼬마김밥 키트",
        category: "식품",
        image: "https://images.unsplash.com/photo-1656428254976-2acc5a8b03bd?auto=format&fit=crop&w=300&q=80",
        link: "https://link.coupang.com/a/gcGQrI1VZs",
        badge: "간편한끼"
      },
      {
        id: 6,
        title: "릿첼 유아용 리클라이너 소프트 의자",
        category: "육아용품",
        image: "https://plus.unsplash.com/premium_photo-1661412706592-0d43f0b0b440?auto=format&fit=crop&w=300&q=80",
        link: "https://link.coupang.com/a/gcG22CNmgu",
        badge: "육아꿀템"
      },
      {
        id: 7,
        title: "홈스타 바르는 곰팡이 싹 세정제, 120ml, 2개",
        category: "생활용품",
        image: "https://plus.unsplash.com/premium_photo-1678304224523-d25b4117558f?auto=format&fit=crop&w=300&q=80",
        link: "https://link.coupang.com/a/gcG6KIxhca",
        badge: "청소필수"
      },
      {
        id: 8,
        title: "쿠첸 제로핏 음식물 처리기 가정용",
        category: "가전제품",
        image: "https://plus.unsplash.com/premium_photo-1723983445020-866f5647ef79?auto=format&fit=crop&w=300&q=80",
        link: "https://link.coupang.com/a/gcGFMrxexg",
        badge: "삶의질상승"
      }
    ];

    let currentCategory = "전체";
    let searchQuery = "";

    const productGrid = document.getElementById("productGrid");
    const noResults = document.getElementById("noResults");
    const searchInput = document.getElementById("searchInput");
    const categoryButtonsContainer =
      document.getElementById("categoryButtons");

    // 카테고리 버튼 표시
    function initCategories() {
      categoryButtonsContainer.innerHTML = categories.map(cat => `
        <button
          type="button"
          onclick="setCategory('${cat}')"
          class="px-3 py-1 rounded-full text-xs font-medium transition-all whitespace-nowrap border ${
            cat === currentCategory
              ? "bg-rose-500 text-white border-rose-500"
              : "bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100"
          }"
        >
          ${cat}
        </button>
      `).join("");
    }

    // 상품 목록 표시
    function renderProducts() {
      const filtered = products.filter(product => {
        const matchesCategory =
          currentCategory === "전체" ||
          product.category === currentCategory;

        const matchesSearch =
          product.title.toLowerCase().includes(
            searchQuery.toLowerCase()
          );

        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        productGrid.innerHTML = "";
        noResults.classList.remove("hidden");
        return;
      }

      noResults.classList.add("hidden");

      productGrid.innerHTML = filtered.map(product => `
        <a
          href="${product.link}"
          target="_blank"
          rel="sponsored noopener noreferrer"
          class="flex items-center gap-3 p-3 bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md hover:border-rose-200 transition-all group"
        >
          <div class="relative w-16 h-16 rounded-xl overflow-hidden bg-gray-100 flex-shrink-0">
            <img
              src="${product.image}"
              alt="${
                product.illustration
                  ? product.category + " 연출 이미지"
                  : product.title
              }"
              loading="lazy"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
            >
          </div>

          <div class="flex-grow min-w-0 pr-1">

            <div class="flex items-center gap-1.5 mb-1">
              <span class="text-[10px] font-semibold text-rose-500 bg-rose-50 px-1.5 py-0.5 rounded">
                ${product.badge || product.category}
              </span>

              ${
                product.illustration
                  ? '<span class="text-[9px] text-gray-400">연출 이미지</span>'
                  : ""
              }
            </div>

            <h2 class="text-xs font-medium text-gray-800 break-words leading-relaxed group-hover:text-rose-500 transition-colors">
              ${product.title}
            </h2>

            <p class="text-[11px] text-gray-400 mt-0.5">
              쿠팡에서 가격 확인하기
            </p>

          </div>

          <i class="fa-solid fa-chevron-right text-xs text-gray-300 group-hover:text-rose-500 group-hover:translate-x-0.5 transition-all mr-1"></i>
        </a>
      `).join("");
    }

    // 카테고리 변경
    function setCategory(category) {
      currentCategory = category;
      initCategories();
      renderProducts();
    }

    // 상품 검색
    searchInput.addEventListener("input", event => {
      searchQuery = event.target.value;
      renderProducts();
    });

    // 처음 화면 표시
    initCategories();
    renderProducts();
  </script>

</body>
</html>
