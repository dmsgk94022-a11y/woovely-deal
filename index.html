<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우블리맘의 추천 핫딜 - 쿠팡 파트너스 모음</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome (아이콘용) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
        <!-- 로고 / 타이틀 -->
        <h1 class="text-xl sm:text-2xl font-bold text-gray-900 flex items-center gap-2">
          <i class="fa-solid font-black text-rose-500 fa-heart"></i>
          <span>우블리맘의 추천 핫딜</span>
        </h1>
        <!-- 검색창 -->
        <div class="relative w-full sm:w-72">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="상품명으로 검색..." 
            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-transparent transition-all"
          >
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
        </div>
      </div>

      <!-- 카테고리 필터 버튼 -->
      <div class="flex items-center gap-2 mt-4 overflow-x-auto pb-1 text-sm no-scrollbar" id="categoryButtons">
        <!-- JS로 동적 생성 -->
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex-grow w-full">
    
    <!-- 상품 목록 그리드 -->
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6">
      <!-- JS에서 카드가 동적으로 삽입됩니다. -->
    </div>

    <!-- 검색 결과 없을 때 -->
    <div id="noResults" class="hidden text-center py-16">
      <i class="fa-solid fa-box-open text-4xl text-gray-300 mb-3"></i>
      <p class="text-gray-500 font-medium">검색 결과에 맞는 상품이 없습니다.</p>
    </div>

  </main>

  <!-- Footer (공지문구 포함) -->
  <footer class="bg-gray-100 border-t border-gray-200 mt-12 py-6">
    <div class="max-w-6xl mx-auto px-4 text-center text-xs text-gray-500 space-y-2">
      <p class="font-semibold text-gray-600">
        이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
      </p>
      <p>© 우블리맘의 추천 핫딜. All rights reserved.</p>
    </div>
  </footer>

  <!-- JavaScript -->
  <script>
    const categories = ["전체", "식품", "건강식품", "화장품", "육아용품", "생활용품", "가전제품"];

    // -------------------------------------------------------------
    // 상품 데이터 (요청하신 8개 완성형 데이터)
    // -------------------------------------------------------------
    const products = [
      {
        id: 1,
        title: "풀무원 토이쿠키 만들기 신비한 바닷속 이야기 (냉동)",
        category: "식품",
        image: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=500&auto=format&fit=crop",
        link: "https://link.coupang.com/a/gcGL1vkoP6",
        badge: "인기키트"
      },
      {
        id: 2,
        title: "뽀로로 DIY 콤비네이션 피자 (냉동)",
        category: "식품",
        image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&auto=format&fit=crop",
        link: "https://link.coupang.com/a/gcGOTAfOJo",
        badge: "아이간식"
      },
      {
        id: 3,
        title: "풀무원 소불고기 꼬마김밥 키트",
        category: "식품",
        image: "https://images.unsplash.com/photo-1553163147-622ab57be1c7?w=500&auto=format&fit=crop",
        link: "https://link.coupang.com/a/gcGQrI1VZs",
        badge: "간편한끼"
      },
      {
        id: 4,
        title: "[추석 세일]풍년보감 6년근 고려홍삼정 올데이굿타임 스틱 100p",
        category: "건강식품",
        image: "https://images.unsplash.com/photo-1584017911766-d451b3d0e843?w=500&auto=format&fit=crop",
        link: "https://link.coupang.com/a/gcGWcbIUA8",
        badge: "추석세일"
      },
      {
        id: 5,
        title: "[추석 세일]아이오페 슈퍼바이탈 기초 2종 기획세트",
        category: "화장품",
        image: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=500&auto=format&fit=crop",
        link: "https://link.coupang.com/a/gcGZcmffSS",
        badge: "추석선물"
      },
      {
        id: 6,
        title: "릿첼 유아용 리클라이너 소프트 의자",
        category: "육아용품",
        image: "https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=500&auto=format&fit=crop",
        link: "https://link.coupang.com/a/gcG22CNmgu",
        badge: "육아꿀템"
      },
      {
        id: 7,
        title: "홈스타 바르는 곰팡이 싹 세정제, 120ml, 2개",
        category: "생활용품",
        image: "https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=500&auto=format&fit=crop",
        link: "https://link.coupang.com/a/gcG6KIxhca",
        badge: "청소필수"
      },
      {
        id: 8,
        title: "쿠첸 제로핏 음식물 처리기 가정용",
        category: "가전제품",
        image: "https://images.unsplash.com/photo-1585659722983-3a675dabf23d?w=500&auto=format&fit=crop",
        link: "https://link.coupang.com/a/gcGFMrxexg",
        badge: "삶의질상승"
      }
    ];

    let currentCategory = "전체";
    let searchQuery = "";

    const productGrid = document.getElementById("productGrid");
    const noResults = document.getElementById("noResults");
    const searchInput = document.getElementById("searchInput");
    const categoryButtonsContainer = document.getElementById("categoryButtons");

    function initCategories() {
      categoryButtonsContainer.innerHTML = categories.map(cat => `
        <button 
          onclick="setCategory('${cat}')"
          class="category-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium transition-all whitespace-nowrap border ${
            cat === currentCategory 
              ? 'bg-rose-500 text-white border-rose-500 shadow-sm' 
              : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-100'
          }"
        >
          ${cat}
        </button>
      `).join('');
    }

    function renderProducts() {
      const filtered = products.filter(product => {
        const matchesCategory = currentCategory === "전체" || product.category === currentCategory;
        const matchesSearch = product.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        productGrid.innerHTML = "";
        noResults.classList.remove("hidden");
        return;
      }

      noResults.classList.add("hidden");

      productGrid.innerHTML = filtered.map(product => `
        <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden flex flex-col justify-between border border-gray-100 group">
          <div>
            <div class="relative overflow-hidden aspect-square bg-gray-100">
              <img 
                src="${product.image}" 
                alt="${product.title}" 
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                loading="lazy"
              >
              ${product.badge ? `
                <span class="absolute top-2 left-2 bg-rose-500 text-white text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded shadow">
                  ${product.badge}
                </span>
              ` : ''}
            </div>

            <div class="p-3 sm:p-4">
              <p class="text-[11px] text-rose-500 font-semibold mb-1">${product.category}</p>
              <h2 class="text-xs sm:text-sm font-medium text-gray-800 line-clamp-2 h-8 sm:h-10 mb-2 group-hover:text-rose-500 transition-colors">
                ${product.title}
              </h2>
              <div class="text-xs sm:text-sm font-semibold text-gray-500">
                쿠팡 최저가 확인하기
              </div>
            </div>
          </div>

          <div class="p-3 sm:p-4 pt-0">
            <a 
              href="${product.link}" 
              target="_blank" 
              rel="noopener noreferrer"
              class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold text-xs sm:text-sm py-2 px-3 rounded-lg flex items-center justify-center gap-1.5 transition-colors shadow-sm"
            >
              <span>최저가 바로가기</span>
              <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </a>
          </div>
        </div>
      `).join('');
    }

    function setCategory(category) {
      currentCategory = category;
      initCategories();
      renderProducts();
    }

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderProducts();
    });

    initCategories();
    renderProducts();
  </script>
</body>
</html>
